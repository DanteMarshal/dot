[package]
name = "rust-skills-checks"
version = "0.0.0"
edition = "2024"
publish = false

# Harness for compile-checking the ```rust examples in ../rules/*.md.
# Each candidate block is generated into examples/ and type-checked with
# `cargo check --examples`. Not part of the published skill.

[lib]
path = "src/lib.rs"

[dependencies]
ahash = "0.8"
anyhow = "1"
arrayvec = "0.7"
bumpalo = "3"
bytes = "1"
compact_str = "0.9"
criterion = "0.5"
futures = "0.3"
indexmap = "2"
insta = "1"
log = "0.4"
loom = "0.7"
memchr = "2"
mockall = "0.13"
once_cell = "1"
parking_lot = "0.12"
proc-macro2 = "1"
proptest = "1"
quote = "1"
rayon = "1"
rustc-hash = "2"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
smartstring = "1"
static_assertions = "1"
syn = { version = "2", features = ["full", "extra-traits", "derive"] }
tempfile = "3"
thin-vec = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = false
