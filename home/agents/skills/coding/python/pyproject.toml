[tool.ty.rules]
all = "error"

[tool.ruff]
indent-width = 2
line-length = 256

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "BLE001",
  "C901",
  "COM812",
  "CPY001",
  "D100",
  "D101",
  "D102",
  "D102",
  "D103",
  "D104",
  "D105",
  "D105",
  "D107",
  "D107",
  "D203",
  "D213",
  "EM101",
  "EM102",
  "ERA001",
  "FIX002",
  "INP001",
  "ISC001",
  "PLR0912",
  "PLR0915",
  "PLR2004",
  "PTH123",
  "S603",
  "S607",
  "SIM108",
  "T201",
  "TC001",
  "TC002",
  "TC003",
  "TD002",
  "TD003",
  "TID252",
  "TRY003",
]

[tool.ruff.lint.extend-per-file-ignores]
"**/__init__.py" = ["F401", "I001"] # for `__init__.py` files
"**/test_*.py" = ["S101", "PT009", "PT027"] # unittest is the repository test runner
